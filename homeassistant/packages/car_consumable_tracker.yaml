# Example Home Assistant package for Car Consumable Tracker (CCT).
# Copy to <config>/packages/ and enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# In secrets.yaml add:  cct_auth: "Bearer <your CCT_API_TOKEN>"
# Replace UNRAID-IP:8000 and vehicle id 1 / "golf" with your own values.

rest:
  - resource: http://UNRAID-IP:8000/api/v1/vehicles/1/status
    headers:
      Authorization: !secret cct_auth
    scan_interval: 900
    sensor:
      - name: "Golf odometer"
        unique_id: cct_1_odometer
        value_template: "{{ value_json.odometer_km }}"
        unit_of_measurement: km
        device_class: distance
        state_class: total_increasing
      - name: "Golf tyre tread min"
        unique_id: cct_1_tread_min
        value_template: "{{ value_json.tyres.min_depth_mm if value_json.tyres else none }}"
        unit_of_measurement: mm
        json_attributes_path: "$.tyres"
        json_attributes: [name, tyre_type, depths_mm, last_measured_on]
      - name: "Golf oil added since change"
        unique_id: cct_1_oil_added
        value_template: "{{ value_json.oil.added_since_change_l }}"
        unit_of_measurement: L
        json_attributes_path: "$.oil"
        json_attributes: [last_change_on, km_since_change, consumption_l_per_1000km]
      - name: "Golf costs this year"
        unique_id: cct_1_costs_year
        value_template: "{{ value_json.costs.this_year | float }}"
        unit_of_measurement: EUR
        device_class: monetary
        json_attributes_path: "$.costs"
        json_attributes: [total, by_category]
      - name: "Golf next inspection"
        unique_id: cct_1_next_inspection
        device_class: date
        value_template: "{{ value_json.maintenance.inspection.next_due_on if value_json.maintenance.inspection is defined else none }}"
      - name: "Golf next service km"
        unique_id: cct_1_next_service_km
        unit_of_measurement: km
        value_template: "{{ value_json.maintenance.service.next_due_km if value_json.maintenance.service is defined else none }}"
        json_attributes: [maintenance]

# All judgements (due, too low) live in Home Assistant, not in CCT. Tune thresholds to taste.
template:
  - binary_sensor:
      - name: "Golf tyre tread low"
        unique_id: cct_1_tread_low
        device_class: problem
        # 4 mm for winter/all-season tyres, 3 mm for summer tyres (legal minimum is 1.6 mm)
        state: >-
          {% set mm = states('sensor.golf_tyre_tread_min') | float(none) %}
          {% set type = state_attr('sensor.golf_tyre_tread_min', 'tyre_type') %}
          {% set limit = 3.0 if type == 'summer' else 4.0 %}
          {{ mm is not none and mm < limit }}
      - name: "Golf inspection due"
        unique_id: cct_1_inspection_due
        device_class: problem
        state: >-
          {% set d = states('sensor.golf_next_inspection') %}
          {{ d not in ['unknown', 'unavailable', 'none']
             and (as_datetime(d).date() - now().date()).days <= 30 }}
      - name: "Golf service due"
        unique_id: cct_1_service_due
        device_class: problem
        state: >-
          {% set due = states('sensor.golf_next_service_km') | int(0) %}
          {% set odo = states('sensor.golf_odometer') | int(0) %}
          {{ due > 0 and odo >= due - 1000 }}

# Push mileage from a car integration (or a manual input_number) into CCT.
rest_command:
  cct_update_odometer:
    url: "http://UNRAID-IP:8000/api/v1/vehicles/{{ vehicle_id }}/odometer"
    method: POST
    headers:
      Authorization: !secret cct_auth
    content_type: "application/json"
    payload: '{"odometer_km": {{ km | int }}, "source": "integration"}'

automation:
  # Receives events CCT sends when CCT_HA_WEBHOOK_URL points at
  # http://<ha>:8123/api/webhook/car_consumable_tracker
  - alias: "CCT: notify on low tread after a measurement"
    triggers:
      - trigger: webhook
        webhook_id: car_consumable_tracker
        allowed_methods: [POST]
        local_only: true
    conditions:
      - condition: template
        value_template: >-
          {% set d = trigger.json.data %}
          {{ trigger.json.type == 'tread_measured' and d.min_depth_mm is not none
             and d.min_depth_mm < (3.0 if d.tyre_type == 'summer' else 4.0) }}
    actions:
      - action: persistent_notification.create
        data:
          title: "Tyre tread low"
          message: >-
            Vehicle {{ trigger.json.vehicle_id }}: lowest tread is
            {{ trigger.json.data.min_depth_mm }} mm.

  # Example: sync the odometer nightly from a car integration sensor.
